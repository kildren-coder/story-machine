<title>瓜熟迪落拉日报样稿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #EDF0F2;
    --paper: #F8F9FA;
    --ink: #1C2530;
    --ink-2: #4A5866;
    --ink-3: #7B8794;
    --rule: #CDD4DB;
    --rule-soft: #DEE3E8;
    --accent: #0E6B6B;
    --accent-soft: #D7ECEA;
    --hedge: #6A4FA3;
    --hedge-soft: #ECE6F7;
    --ok: #2F7A4C;      --ok-soft: #DDEFE3;
    --warn: #A8701A;    --warn-soft: #F6EAD2;
    --bad: #B23A3A;     --bad-soft: #F5DDDD;
    --none: #6E7A86;    --none-soft: #E4E8EC;
    --chip: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,30,40,.08), 0 8px 24px rgba(20,30,40,.08);
    --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12171C; --paper: #1A2026; --ink: #E4E9ED; --ink-2: #AEB8C2; --ink-3: #7D8894;
      --rule: #333C46; --rule-soft: #28313A; --accent: #5BBDBD; --accent-soft: #163A3A;
      --hedge: #B49BEA; --hedge-soft: #2C2540;
      --ok: #7CC69A; --ok-soft: #1B3326; --warn: #E0B15A; --warn-soft: #3A2E14;
      --bad: #E58080; --bad-soft: #3D1F1F; --none: #97A3AE; --none-soft: #262E36;
      --chip: #232B33; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12171C; --paper: #1A2026; --ink: #E4E9ED; --ink-2: #AEB8C2; --ink-3: #7D8894;
    --rule: #333C46; --rule-soft: #28313A; --accent: #5BBDBD; --accent-soft: #163A3A;
    --hedge: #B49BEA; --hedge-soft: #2C2540;
    --ok: #7CC69A; --ok-soft: #1B3326; --warn: #E0B15A; --warn-soft: #3A2E14;
    --bad: #E58080; --bad-soft: #3D1F1F; --none: #97A3AE; --none-soft: #262E36;
    --chip: #232B33; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15.5px; line-height: 1.85;
    padding-inline: 16px; padding-block: 0 96px;
  }
  a { color: var(--accent); }
  h1, h2, h3, h4 { font-family: var(--serif); text-wrap: balance; margin: 0; line-height: 1.3; }
  p { margin: 0; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .narrow { max-width: 42em; }

  /* 报头 */
  .masthead { padding-block: 36px 20px; border-bottom: 2px solid var(--ink); display: grid; gap: 8px; }
  .masthead .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .masthead h1 { font-size: 30px; font-weight: 700; }
  .masthead .sub { color: var(--ink-2); font-size: 14px; }
  .proto-note { margin-top: 14px; padding: 10px 14px; border-left: 3px solid var(--hedge); background: var(--hedge-soft); color: var(--ink-2); font-size: 13.5px; line-height: 1.7; border-radius: 0 6px 6px 0; }
  .proto-note b { color: var(--ink); }

  /* 通用小件 */
  .ts { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--accent); background: var(--chip); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; text-decoration: none; white-space: nowrap; line-height: 1.6; vertical-align: 1px; }
  .ts:hover { background: var(--accent-soft); }
  .ts.play::before { content: "▶ "; font-size: 9px; }
  .who { font-weight: 700; color: var(--ink); }
  .hedge { text-decoration: underline dotted var(--hedge) 1.5px; text-underline-offset: 3px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; line-height: 1.6; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.none { background: var(--none-soft); color: var(--none); }
  .badge.kind { background: var(--accent-soft); color: var(--accent); }
  .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .meta { color: var(--ink-3); font-size: 13px; }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  /* 目录条 */
  .toc { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-block: 14px; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .toc a { color: var(--ink-2); text-decoration: none; }
  .toc a:hover { color: var(--accent); }
  .toc .n { font-family: var(--mono); color: var(--ink-3); margin-right: 4px; }

  /* 章节 */
  section.block { padding-block: 28px; border-bottom: 1px solid var(--rule); }
  section.block > h2 { font-size: 22px; margin-bottom: 4px; }
  section.block > .meta { margin-bottom: 18px; }
  .topic { padding-block: 18px 6px; }
  .topic h3 { font-size: 18px; margin-bottom: 4px; }
  .topic .ranges { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prose { max-width: 42em; display: grid; gap: 12px; }
  .prose p { text-align: justify; }

  /* 原话 */
  details.quotes { margin-top: 12px; max-width: 42em; }
  details.quotes summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; user-select: none; }
  details.quotes summary:hover { color: var(--accent); }
  .quote { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--rule-soft); font-size: 14px; align-items: start; }
  .quote:first-of-type { border-top: 0; margin-top: 6px; }
  .quote .q { color: var(--ink); }
  .quote .q b { font-weight: 500; color: var(--ink-2); }
  .quote .ctx { color: var(--ink-3); font-size: 13px; margin-top: 4px; line-height: 1.7; }
  .quote .ctx mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; }

  /* 核查台账：不是卡片，是有格线的账本 */
  .ledger { margin-top: 18px; border-top: 2px solid var(--ink); }
  .ledger .row { display: grid; grid-template-columns: 7.5em 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); }
  .ledger .row .k { font-family: var(--serif); font-weight: 700; font-size: 14px; color: var(--ink-2); padding-top: 2px; }
  .ledger .row .v { display: grid; gap: 8px; font-size: 14.5px; }
  .ledger ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .ledger li::marker { color: var(--ink-3); }
  .claim { display: grid; gap: 4px; }
  .claim .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .claim .basis { color: var(--ink-2); font-size: 13.5px; }
  .claim .basis a { word-break: break-all; }
  .then-now { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .then-now th, .then-now td { text-align: left; vertical-align: top; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule-soft); }
  .then-now th { font-weight: 500; color: var(--ink-3); font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; }
  .then-now td:first-child { color: var(--ink-2); white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .reading { display: grid; gap: 2px; }
  .reading .t { font-weight: 500; }
  .reading .why { color: var(--ink-2); font-size: 13.5px; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; }
  .src { font-size: 12.5px; color: var(--ink-2); background: var(--chip); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px; text-decoration: none; }
  .src:hover { border-color: var(--accent); color: var(--accent); }

  /* 事件版：事件索引 */
  .event-index { display: grid; gap: 0; border-top: 2px solid var(--ink); margin-top: 12px; }
  .event-index a { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); color: var(--ink); text-decoration: none; align-items: baseline; }
  .event-index a:hover .t { color: var(--accent); }
  .event-index .t { font-family: var(--serif); font-weight: 700; font-size: 16px; }
  .event-index .whos { color: var(--ink-3); font-size: 13px; }
  .event-index .st { display: flex; gap: 6px; }
  .said-by { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .said-by .src { font-weight: 500; }
  .six { display: grid; gap: 0; border-top: 2px solid var(--ink); margin-top: 14px; }
  .six .q { display: grid; grid-template-columns: 9em 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
  .six .q .k { font-family: var(--serif); font-weight: 700; color: var(--ink); font-size: 15px; line-height: 1.5; }
  .six .q .k small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
  .six .q .v { display: grid; gap: 8px; font-size: 14.5px; }

  /* 对读版：正文 + 旁注 */
  .duet { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .duet .left { display: grid; gap: 12px; }
  .duet .right { display: grid; gap: 10px; position: sticky; top: 14px; }
  .note { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; line-height: 1.7; }
  .note .label { margin-bottom: 4px; display: block; }
  .note.ok { border-left: 3px solid var(--ok); }
  .note.warn { border-left: 3px solid var(--warn); }
  .note.bad { border-left: 3px solid var(--bad); }
  .note.none { border-left: 3px solid var(--none); }
  .note.hist { border-left: 3px solid var(--accent); }
  .note ul { margin: 4px 0 0; padding-left: 1.1em; }

  /* 对照 */
  .compare { width: 100%; border-collapse: collapse; font-size: 14px; }
  .compare th, .compare td { text-align: left; vertical-align: top; padding: 10px 10px 10px 0; border-bottom: 1px solid var(--rule-soft); }
  .compare th { font-family: var(--serif); color: var(--ink-2); font-size: 13.5px; }
  .compare td:first-child { font-weight: 500; white-space: nowrap; }

  /* 渠道 */
  .chan { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--rule-soft); font-size: 14px; }

  /* 原型切换条 */
  .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: var(--shadow); font-family: var(--mono); font-size: 12.5px; z-index: 50; border: 1px solid #333; max-width: calc(100vw - 32px); }
  .switcher button { background: transparent; border: 0; color: #fff; font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 999px; }
  .switcher button:hover, .switcher button:focus-visible { background: #333; outline: none; }
  .switcher .cur { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switcher .cur b { color: #8FE3E3; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 700px) {
    .duet { grid-template-columns: 1fr; }
    .duet .right { position: static; }
    .ledger .row, .six .q { grid-template-columns: 1fr; gap: 4px; }
    .masthead h1 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap" id="app"></div>

<div class="switcher" role="group" aria-label="原型版式切换">
  <button id="prev" aria-label="上一个版式">←</button>
  <span class="cur" id="cur"></span>
  <button id="next" aria-label="下一个版式">→</button>
</div>

<script>
const DATA = /*__DATA__*/null;

// ---------- 工具 ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toSec = ts => { const [h,m,s] = ts.split(':').map(Number); return h*3600 + m*60 + s; };
const bvUrl = (src, ts) => `https://www.bilibili.com/video/${src.bv}?t=${toSec(ts)}`;
const srcById = id => DATA.sources.find(s => s.id === id);
const isPrimary = (ev, src, t) => ev.refs[0].ep === src.id && ev.refs[0].topic === t.id;
const tsLink = (src, ts, play) => `<a class="ts${play?' play':''}" href="${bvUrl(src, ts)}" target="_blank" rel="noopener" title="跳到 B 站 ${ts}">${ts}</a>`;
// 正文里的 [HH:MM:SS] 变成跳播链接；「」内若是限定词由数据标注 <hedge>…</hedge>
const rich = (src, text) => esc(text)
  .replace(/\[(\d{2}:\d{2}:\d{2})\]/g, (_, ts) => tsLink(src, ts))
  .replace(/&lt;hedge&gt;(.*?)&lt;\/hedge&gt;/g, '<span class="hedge" title="主播原话带不确定语气，原样保留">$1</span>')
  .replace(/&lt;who&gt;(.*?)&lt;\/who&gt;/g, '<span class="who">$1</span>');
const badge = v => ({ok:'有据',warn:'有争议',bad:'讲错了',none:'未查到'}[v] ? `<span class="badge ${v}">${({ok:'有据',warn:'有争议',bad:'讲错了',none:'未查到'})[v]}</span>` : '');
const rangesHtml = (src, ranges) => ranges.map(([a,b]) => `<span class="meta">${tsLink(src,a,true)} <span class="meta">–</span> ${tsLink(src,b)}</span>`).join('');
const srcChip = (u, t) => u ? `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : `<span class="src">${esc(t)}</span>`;

function quotesHtml(src, quotes) {
  if (!quotes || !quotes.length) return '';
  return `<details class="quotes"><summary>原话与逐字稿片段（${quotes.length} 处）</summary>${quotes.map(q => `
    <div class="quote">${tsLink(src, q.ts, true)}<div><div class="q"><b>${esc(q.who)}：</b>「${esc(q.text)}」</div>${q.ctx ? `<div class="ctx">逐字稿 ${esc(q.ts)} 段：${esc(q.ctx).replace(esc(q.text), `<mark>${esc(q.text)}</mark>`)}</div>` : ''}</div></div>`).join('')}</details>`;
}

function claimsHtml(src, items) {
  if (!items || !items.length) return '<span class="meta">无</span>';
  return `<ul>${items.map(c => `<li class="claim"><div class="head">${c.ts ? tsLink(src, c.ts) : ''}<span>${rich(src, c.claim)}</span>${badge(c.verdict)}</div>${c.basis ? `<div class="basis">${rich(src, c.basis)}${(c.links||[]).map(l => ` <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('')}</div>` : ''}</li>`).join('')}</ul>`;
}
const listHtml = (src, items) => (!items || !items.length) ? '<span class="meta">无</span>' : `<ul>${items.map(x => `<li>${rich(src, x.text || x)}${x.links ? x.links.map(l => ` <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('') : ''}</li>`).join('')}</ul>`;

function historyHtml(src, h) {
  if (!h) return '<span class="meta">这件事只核了个别说法，没做先例检索</span>';
  let out = `<div>${rich(src, h.precedent)}</div>`;
  if (h.thenNow && h.thenNow.length) out += `<div class="table-wrap"><table class="then-now"><tr><th>维度</th><th>当时</th><th>现在</th></tr>${h.thenNow.map(r => `<tr><td>${esc(r[0])}</td><td>${rich(src,r[1])}</td><td>${rich(src,r[2])}</td></tr>`).join('')}</table></div>`;
  return out;
}
function readingsHtml(items) {
  if (!items || !items.length) return '<span class="meta">无</span>';
  return `<ul>${items.map(r => `<li class="reading"><span class="t">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title)}</span>${r.by ? `<span class="meta"> · ${esc(r.by)}</span>` : ''}<div class="why">${esc(r.why)}</div></li>`).join('')}</ul>`;
}

// 一个事件的核查台账（六问里的后五问）
function ledgerHtml(src, ev) {
  const c = ev.check;
  if (!c) return '';
  return `<div class="ledger">
    <div class="row"><div class="k">事实偏差</div><div class="v">${claimsHtml(src, c.deviations)}</div></div>
    <div class="row"><div class="k">支持的证据</div><div class="v">${listHtml(src, c.support)}</div></div>
    <div class="row"><div class="k">不支持的情况</div><div class="v">${listHtml(src, c.against)}</div></div>
    <div class="row"><div class="k">历史上有过吗</div><div class="v">${historyHtml(src, c.history)}</div></div>
    <div class="row"><div class="k">有见地的分析</div><div class="v">${readingsHtml(c.history && c.history.readings)}</div></div>
    <div class="row"><div class="k">核查依据</div><div class="v"><div class="sources">${(c.sources||[]).map(s => srcChip(s.url, s.t)).join('')}</div><div class="meta">${esc(c.note || '')}</div></div></div>
  </div>`;
}

function topicHtml(src, t, withLedger) {
  const ev = DATA.events.find(e => e.refs.some(r => r.ep === src.id && r.topic === t.id));
  return `<div class="topic" id="${src.id}-${t.id}">
    <h3>${esc(t.title)}</h3>
    <div class="ranges">${rangesHtml(src, t.ranges)}<span class="meta">· ${esc(t.who)}</span>${ev && ev.check ? badge(ev.check.overall) : ''}</div>
    <div class="prose">${t.paras.map(p => `<p>${rich(src, p)}</p>`).join('')}</div>
    ${quotesHtml(src, t.quotes)}
    ${withLedger && ev && ev.check ? (isPrimary(ev, src, t) ? ledgerHtml(src, ev) : `<div class="meta" style="margin-top:10px">核查台账并入「${esc(srcById(ev.refs[0].ep).topics.find(x => x.id === ev.refs[0].topic).title)}」<a href="#${ev.refs[0].ep}-${ev.refs[0].topic}">↑</a></div>`) : ''}
  </div>`;
}

function mastheadHtml(variantName) {
  return `<header class="masthead">
    <div class="eyebrow">${esc(DATA.date)} · 日报 · 版式 ${esc(variantName)}</div>
    <h1>${esc(DATA.title)}</h1>
    <div class="sub">${esc(DATA.subtitle)}</div>
    <div class="proto-note">${DATA.protoNote}</div>
  </header>`;
}
function channelsHtml() {
  const rows = [];
  DATA.sources.forEach(src => (src.channels||[]).forEach(c => rows.push(`<div class="chan">${tsLink(src, c.ts, true)}<div><span class="who">${esc(c.who)}</span> 提到 ${rich(src, c.text)}</div></div>`)));
  return rows.length ? `<section class="block"><h2>他们提到的信源</h2><div class="meta">直播里点名的书、报道、人、数据源。原项目目的 (B) 的零成本保留。</div>${rows.join('')}</section>` : '';
}
function compareHtml() {
  const evs = DATA.events.filter(e => e.refs.length > 1);
  if (!evs.length) return '';
  return `<section class="block"><h2>同一件事，不同场次怎么说</h2><div class="meta">${esc(DATA.compareNote)}</div>
  <div class="table-wrap"><table class="compare"><tr><th>事件</th>${DATA.sources.map(s => `<th>${esc(s.label)}</th>`).join('')}</tr>
  ${evs.map(e => `<tr><td><a href="#ev-${e.id}">${esc(e.title)}</a></td>${DATA.sources.map(s => { const r = e.refs.find(x => x.ep === s.id); return `<td>${r ? rich(s, r.gist) + ' ' + tsLink(s, r.ts) : '<span class="meta">未谈</span>'}</td>`; }).join('')}</tr>`).join('')}
  </table></div></section>`;
}

// ---------- 版式 A：按场次读 ----------
function renderA() {
  return mastheadHtml('A · 按场次读') +
    `<nav class="toc">${DATA.sources.map((s,i) => `<a href="#${s.id}"><span class="n">${i+1}</span>${esc(s.label)}</a>`).join('')}<a href="#cmp"><span class="n">※</span>对照</a></nav>` +
    DATA.sources.map(src => `<section class="block" id="${src.id}">
      <h2>${esc(src.show)} · ${esc(src.date)}</h2>
      <div class="meta"><span class="badge kind">${esc(src.kind)}</span> ${esc(src.up)} · ${esc(src.speakers.join('、'))} · 全长 ${esc(src.length)} · <a href="https://www.bilibili.com/video/${src.bv}" target="_blank" rel="noopener">原视频</a></div>
      <div class="prose narrow"><p><b>这场在讲什么。</b>${rich(src, src.lede)}</p></div>
      ${src.topics.map(t => topicHtml(src, t, true)).join('')}
    </section>`).join('') +
    `<div id="cmp"></div>` + compareHtml() + channelsHtml();
}

// ---------- 版式 B：按事件读 ----------
function eventCardHtml(ev) {
  const primary = srcById(ev.refs[0].ep);
  const c = ev.check || {};
  return `<section class="block" id="ev-${ev.id}">
    <h2>${esc(ev.title)}</h2>
    <div class="meta" style="margin-bottom:10px">${c.overall ? badge(c.overall) : ''} ${esc(ev.tag||'')}</div>
    <div class="said-by">${ev.refs.map(r => { const s = srcById(r.ep); return `<a class="src" href="#${s.id}-${r.topic}">${esc(s.label)} ${esc(r.ts)}</a>`; }).join('')}</div>
    <div class="six">
      <div class="q"><div class="k">讲了什么<small>WHAT WAS SAID</small></div><div class="v">${ev.refs.map(r => { const s = srcById(r.ep); const t = s.topics.find(x => x.id === r.topic); return `<div class="prose">${t.paras.map(p => `<p>${rich(s, p)}</p>`).join('')}</div>${quotesHtml(s, t.quotes)}`; }).join('')}</div></div>
      <div class="q"><div class="k">重大事实偏差<small>DEVIATIONS</small></div><div class="v">${claimsHtml(primary, c.deviations)}</div></div>
      <div class="q"><div class="k">支持这看法的证据<small>FOR</small></div><div class="v">${listHtml(primary, c.support)}</div></div>
      <div class="q"><div class="k">不支持的情况<small>AGAINST</small></div><div class="v">${listHtml(primary, c.against)}</div></div>
      <div class="q"><div class="k">历史上发生过吗<small>PRECEDENT · THEN vs NOW</small></div><div class="v">${historyHtml(primary, c.history)}</div></div>
      <div class="q"><div class="k">有见地的分析<small>READINGS</small></div><div class="v">${readingsHtml(c.history && c.history.readings)}</div></div>
      <div class="q"><div class="k">核查依据<small>SOURCES</small></div><div class="v"><div class="sources">${(c.sources||[]).map(s => srcChip(s.url, s.t)).join('')}</div><div class="meta">${esc(c.note||'')}</div></div></div>
    </div>
  </section>`;
}
function renderB() {
  const checked = DATA.events.filter(e => e.check);
  const rest = DATA.events.filter(e => !e.check);
  return mastheadHtml('B · 按事件读') +
    `<section class="block"><h2>昨天都谈了什么</h2><div class="meta">按事件聚合。带标记的做过核查，其余只整理未核查。</div>
    <div class="event-index">${DATA.events.map(e => `<a href="#ev-${e.id}"><span><span class="t">${esc(e.title)}</span><div class="whos">${e.refs.map(r => srcById(r.ep).label + ' ' + r.ts).join(' · ')}</div></span><span class="st">${e.check ? badge(e.check.overall) : '<span class="badge none">只整理</span>'}</span></a>`).join('')}</div></section>` +
    checked.map(eventCardHtml).join('') +
    (rest.length ? `<section class="block"><h2>其余话题（只整理，未核查）</h2>${rest.map(e => e.refs.map(r => { const s = srcById(r.ep); const t = s.topics.find(x => x.id === r.topic); return `<div id="ev-${e.id}">${topicHtml(s, t, false)}</div>`; }).join('')).join('')}</section>` : '') +
    compareHtml() + channelsHtml() +
    `<div style="display:none">${DATA.sources.map(s => s.topics.map(t => `<span id="${s.id}-${t.id}"></span>`).join('')).join('')}</div>`;
}

// ---------- 版式 C：对读（正文 + 旁注） ----------
function renderC() {
  return mastheadHtml('C · 对读') +
    DATA.sources.map(src => `<section class="block" id="${src.id}">
      <h2>${esc(src.show)} · ${esc(src.date)}</h2>
      <div class="meta"><span class="badge kind">${esc(src.kind)}</span> ${esc(src.up)} · ${esc(src.speakers.join('、'))} · 全长 ${esc(src.length)}</div>
      ${src.topics.map(t => {
        const ev = DATA.events.find(e => e.refs.some(r => r.ep === src.id && r.topic === t.id));
        const c = ev && ev.check && isPrimary(ev, src, t) ? ev.check : null;
        const notes = [];
        if (ev && ev.check && !c) {
          notes.push(`<div class="note none"><span class="label">核查</span><span class="meta">并入「${esc(srcById(ev.refs[0].ep).topics.find(x => x.id === ev.refs[0].topic).title)}」的旁注。</span></div>`);
        } else if (c) {
          (c.deviations||[]).forEach(d => notes.push(`<div class="note ${d.verdict}"><span class="label">事实偏差 · ${({ok:'有据',warn:'有争议',bad:'讲错了',none:'未查到'})[d.verdict]}</span>${rich(src, d.claim)}${d.basis ? `<div class="meta" style="margin-top:4px">${rich(src, d.basis)}${(d.links||[]).map(l => ` <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('')}</div>` : ''}</div>`));
          if (c.support && c.support.length) notes.push(`<div class="note ok"><span class="label">支持</span><ul>${c.support.map(x => `<li>${rich(src, x.text||x)}</li>`).join('')}</ul></div>`);
          if (c.against && c.against.length) notes.push(`<div class="note warn"><span class="label">不支持</span><ul>${c.against.map(x => `<li>${rich(src, x.text||x)}</li>`).join('')}</ul></div>`);
          if (c.history) notes.push(`<div class="note hist"><span class="label">历史先例</span>${rich(src, c.history.precedent)}${c.history.thenNow ? `<div class="table-wrap"><table class="then-now"><tr><th>维度</th><th>当时</th><th>现在</th></tr>${c.history.thenNow.map(r => `<tr><td>${esc(r[0])}</td><td>${rich(src,r[1])}</td><td>${rich(src,r[2])}</td></tr>`).join('')}</table></div>` : ''}${c.history.readings ? `<div style="margin-top:6px"><span class="label">值得读</span>${readingsHtml(c.history.readings)}</div>` : ''}</div>`);
          if (c.sources) notes.push(`<div class="note none"><span class="label">核查依据</span><div class="sources">${c.sources.map(s => srcChip(s.url, s.t)).join('')}</div></div>`);
        } else {
          notes.push(`<div class="note none"><span class="label">未核查</span><span class="meta">这一段只做了整理。</span></div>`);
        }
        return `<div class="topic" id="${src.id}-${t.id}"><h3>${esc(t.title)}</h3><div class="ranges">${rangesHtml(src, t.ranges)}<span class="meta">· ${esc(t.who)}</span></div>
          <div class="duet"><div class="left"><div class="prose">${t.paras.map(p => `<p>${rich(src, p)}</p>`).join('')}</div>${quotesHtml(src, t.quotes)}</div><div class="right">${notes.join('')}</div></div></div>`;
      }).join('')}
    </section>`).join('') + compareHtml() + channelsHtml();
}

// ---------- 切换器 ----------
const VARIANTS = [['A','按场次读：整理稿在前，核查台账贴在每个话题下面', renderA], ['B','按事件读：先看昨天有哪些事，每件事回答六问', renderB], ['C','对读：左边讲了什么，右边旁注核查', renderC]];
function current() { const k = new URLSearchParams(location.search).get('variant') || 'A'; const i = VARIANTS.findIndex(v => v[0] === k); return i < 0 ? 0 : i; }
function go(i) { const k = VARIANTS[(i + VARIANTS.length) % VARIANTS.length][0]; const u = new URL(location.href); u.searchParams.set('variant', k); history.replaceState(null, '', u); render(); }
function render() {
  const i = current(); const [k, name, fn] = VARIANTS[i];
  document.getElementById('app').innerHTML = fn();
  document.getElementById('cur').innerHTML = `<b>${k}</b> ${esc(name.split('：')[0])}`;
  document.getElementById('cur').title = name;
  window.scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => go(current() - 1);
document.getElementById('next').onclick = () => go(current() + 1);
document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return; if (e.key === 'ArrowLeft') go(current() - 1); if (e.key === 'ArrowRight') go(current() + 1); });
render();
</script>
